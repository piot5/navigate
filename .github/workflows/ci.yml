# Navigate — CI
#
# Was hier läuft, ist genau das, was lokal auch läuft: Unit-Tests und der
# Release-Build mit R8. Kein Instrumented-Test, weil Navigate keine
# AndroidX-Test-Abhängigkeit hat (und keine haben soll — siehe app/build.gradle.kts).
#
# Signing: ohne die Secrets NAVIGATE_KEYSTORE_PASSWORD / NAVIGATE_KEY_PASSWORD
# bleibt das Release-APK unsigniert (das Buildfile warnt dann nur, es bricht
# nicht ab). Wer signierte Artefakte braucht, legt die Secrets an — der
# Keystore selbst gehört nie ins Repo (siehe .gitignore).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit-Tests
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Release-APK (R8, unsigniert ohne Secrets)
        run: sh ./gradlew --no-daemon :app:assembleRelease

      - name: Testbericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/testDebugUnitTest/

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: navigate-release-unsigniert
          path: app/build/outputs/apk/release/app-release.apk
