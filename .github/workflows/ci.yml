# Navigate — CI
#
# Was hier läuft, ist genau das, was lokal auch läuft: Unit-Tests, Coverage-Gate,
# Lint und der Release-Build mit R8. Kein Instrumented-Test, weil Navigate keine
# AndroidX-Test-Abhängigkeit hat (und keine haben soll — siehe app/build.gradle.kts).
#
# Die Reihenfolge ist Absicht: erst die schnellen Gates (Tests, Coverage, Lint),
# dann der teure Release-Build, dann das Doku-Gate — es braucht das APK.
#
# Signing: ohne die Secrets NAVIGATE_KEYSTORE_PASSWORD / NAVIGATE_KEY_PASSWORD
# bleibt das Release-APK unsigniert (das Buildfile warnt dann nur, es bricht
# nicht ab). Wer signierte Artefakte braucht, legt die Secrets an — der
# Keystore selbst gehört nie ins Repo (siehe .gitignore).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Die Runner-Images bringen das Android-SDK mit (ANDROID_HOME gesetzt,
      # Lizenzen akzeptiert). Der Schritt `android-actions/setup-android@v3`,
      # der bis 0.4 hier stand, scheitert auf den aktuellen Images: er ruft
      # `sdkmanager tools` auf, und das Paket „tools" existiert im Repository
      # nicht mehr (ersetzt durch cmdline-tools) — genau daran ist der erste
      # CI-Lauf dieses Repos gescheitert. Jetzt wird nur geprüft, was fehlt.
      - name: Android SDK prüfen
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36"
          fi
          ls -d "$SDK/platforms"/* || true

      # Abhängigkeiten und Build-Ausgaben über Läufe hinweg behalten: sonst lädt
      # jeder Lauf Kotlin- und AGP-Artefakte neu (in 0.4 nachgemessen: der
      # Release-Build allein braucht auf schwacher Hardware ~15 min).
      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Coverage (Gate + Bericht)
        run: sh ./gradlew --no-daemon :app:unitTestCoverageReport :app:unitTestCoverageVerification

      - name: Lint (Warnungen sind Fehler)
        run: sh ./gradlew --no-daemon :app:lintDebug

      - name: Release-APK (R8, unsigniert ohne Secrets)
        run: sh ./gradlew --no-daemon :app:assembleRelease

      - name: Doku-Gate (Messwerte gegen das APK)
        run: bash tools/check_docs_drift.sh

      - name: Testbericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Coverage-Bericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/build/reports/jacoco/unitTestCoverageReport/

      - name: Lint-Bericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-debug.html

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: navigate-release-unsigniert
          path: app/build/outputs/apk/release/app-release.apk
