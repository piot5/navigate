# Navigate — CI
#
# What runs here is exactly what also runs locally: unit tests, coverage gate,
# lint and the release build with R8. No instrumented test, because Navigate has
# no AndroidX test dependency (and is not supposed to get one — see app/build.gradle.kts).
#
# The order is intentional: first the fast gates (tests, coverage, lint),
# then the expensive release build, then the docs gate — it needs the APK.
#
# Signing: without the secrets NAVIGATE_KEYSTORE_PASSWORD / NAVIGATE_KEY_PASSWORD
# the release APK stays unsigned (the build file only warns then, it does not
# abort). Whoever needs signed artifacts creates the secrets — the
# keystore itself never belongs in the repo (see .gitignore).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner images ship with the Android SDK (ANDROID_HOME set,
      # licenses accepted). The `android-actions/setup-android@v3` step
      # that stood here until 0.4 fails on the current images: it calls
      # `sdkmanager tools`, and the "tools" package no longer exists in the
      # repository (replaced by cmdline-tools) — that is exactly what the first
      # CI run of this repo failed on. Now only what is missing gets checked.
      - name: Check Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36"
          fi
          ls -d "$SDK/platforms"/* || true

      # Keep dependencies and build outputs across runs: otherwise every run
      # downloads Kotlin and AGP artifacts again (re-measured in 0.4: the
      # release build alone needs ~15 min on weak hardware).
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Coverage (gate + report)
        run: sh ./gradlew --no-daemon :app:unitTestCoverageReport :app:unitTestCoverageVerification

      - name: Lint (warnings are errors)
        run: sh ./gradlew --no-daemon :app:lintDebug

      - name: Release APK (R8, unsigned without secrets)
        run: sh ./gradlew --no-daemon :app:assembleRelease

      # The APK name depends on whether it was signed: with credentials
      # `app-release.apk`, without them `app-release-unsigned.apk`. Both cases
      # are provided for (signing needs a secret), which is why the **built**
      # APK is stashed here under a fixed name — otherwise the next step
      # fails on a path that does not exist.
      - name: Name the APK
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$src" navigate-release.apk
          echo "Built: $(basename "$src")"
          ls -l navigate-release.apk

      - name: Docs gate (measured values against the APK)
        run: bash tools/check_docs_drift.sh

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/build/reports/jacoco/unitTestCoverageReport/

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-debug.html

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: navigate-release-unsigniert
          path: navigate-release.apk
