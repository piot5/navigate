# Navigate — Release
#
# Runs only on tags (v0.4, v0.5, …) or by hand. A tag is the promise
# "this version is shipped" — which is why the same gate as in the
# CI (tests, coverage, lint, docs) runs **before** the release is created. A
# release with red tests would be a claim, not an artifact.
#
# Signing: if the secret NAVIGATE_KEYSTORE_BASE64 is set, the keystore
# is written from it to keystore/navigate-release.jks and the build is signed.
# Without the secret an unsigned APK is produced — the run does not abort.
#
# Why `--generate-notes`: the release notes come from the commits, not from
# a second list nobody maintains. The detailed description remains
# in CHANGELOG.md.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # See ci.yml: the SDK is included in the runner image; the earlier
      # `android-actions/setup-android@v3` step fails on `sdkmanager tools`.
      - name: Check Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36"
          fi
          ls -d "$SDK/platforms"/* || true

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Version from the build file
        id: version
        run: |
          version=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Provide the keystore (only if the secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.NAVIGATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/navigate-release.jks
            echo "Keystore written — the build is signed."
          else
            echo "No keystore secret — the APK stays unsigned."
          fi

      - name: Tests
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest

      # The report is generated here as well: the docs gate reads the coverage
      # numbers from the XML file, not from the build result. Without this step
      # it fails with "unitTestCoverageReport.xml is missing" — exactly that
      # happened in the v0.13.1 release run.
      - name: Coverage (gate + report for the docs gate)
        run: sh ./gradlew --no-daemon :app:unitTestCoverageReport :app:unitTestCoverageVerification

      - name: Lint
        run: sh ./gradlew --no-daemon :app:lintDebug

      - name: Release APK
        env:
          NAVIGATE_KEYSTORE_PASSWORD: ${{ secrets.NAVIGATE_KEYSTORE_PASSWORD }}
          NAVIGATE_KEY_PASSWORD: ${{ secrets.NAVIGATE_KEY_PASSWORD }}
        run: sh ./gradlew --no-daemon :app:assembleRelease

      # As in ci.yml: stash the built APK under a fixed name. With the keystore
      # secret it is called `app-release.apk`, without it
      # `app-release-unsigned.apk` — a hardwired path would be wrong in one of
      # the two cases.
      - name: Name the APK
        id: apk
        run: |
          version="${{ steps.version.outputs.version }}"
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$src" "navigate-$version.apk"
          echo "Built: $(basename "$src")"
          ls -l "navigate-$version.apk"

      - name: Docs gate
        run: bash tools/check_docs_drift.sh

      - name: Stash APK
        uses: actions/upload-artifact@v4
        with:
          name: navigate-${{ steps.version.outputs.version }}
          path: navigate-${{ steps.version.outputs.version }}.apk

      - name: Create release (only on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "navigate-${{ steps.version.outputs.version }}.apk" \
            --title "Navigate ${{ steps.version.outputs.version }}" \
            --generate-notes
