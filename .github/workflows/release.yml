# Navigate — Release
#
# Läuft nur auf Tags (v0.4, v0.5, …) oder von Hand. Ein Tag ist die Zusage
# „diese Fassung ist ausgeliefert" — deshalb läuft hier dasselbe Gate wie in der
# CI (Tests, Coverage, Lint, Doku) **vor** dem Anlegen des Releases. Ein Release
# mit roten Tests wäre eine Behauptung, kein Artefakt.
#
# Signieren: Ist das Secret NAVIGATE_KEYSTORE_BASE64 gesetzt, wird der Keystore
# daraus nach keystore/navigate-release.jks geschrieben und der Build signiert.
# Ohne das Secret entsteht ein unsigniertes APK — der Lauf bricht nicht ab.
#
# Warum `--generate-notes`: die Release-Notizen kommen aus den Commits, nicht aus
# einer zweiten Liste, die niemand pflegt. Die ausführliche Beschreibung steht
# weiterhin in CHANGELOG.md.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Siehe ci.yml: das SDK ist im Runner-Image enthalten; der frühere
      # `android-actions/setup-android@v3`-Schritt scheitert an `sdkmanager tools`.
      - name: Android SDK prüfen
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          fi
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -d "$SDK/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36"
          fi
          ls -d "$SDK/platforms"/* || true

      - name: Gradle-Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Version aus dem Buildfile
        id: version
        run: |
          version=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Keystore bereitstellen (nur wenn das Secret existiert)
        env:
          KEYSTORE_BASE64: ${{ secrets.NAVIGATE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/navigate-release.jks
            echo "Keystore geschrieben — der Build signiert."
          else
            echo "Kein Keystore-Secret — das APK bleibt unsigniert."
          fi

      - name: Tests
        run: sh ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Coverage-Gate
        run: sh ./gradlew --no-daemon :app:unitTestCoverageVerification

      - name: Lint
        run: sh ./gradlew --no-daemon :app:lintDebug

      - name: Release-APK
        env:
          NAVIGATE_KEYSTORE_PASSWORD: ${{ secrets.NAVIGATE_KEYSTORE_PASSWORD }}
          NAVIGATE_KEY_PASSWORD: ${{ secrets.NAVIGATE_KEY_PASSWORD }}
        run: sh ./gradlew --no-daemon :app:assembleRelease

      - name: Doku-Gate
        run: bash tools/check_docs_drift.sh

      - name: APK ablegen
        uses: actions/upload-artifact@v4
        with:
          name: navigate-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Release anlegen (nur bei einem Tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/app-release.apk#navigate-${{ steps.version.outputs.version }}.apk" \
            --title "Navigate ${{ steps.version.outputs.version }}" \
            --generate-notes
